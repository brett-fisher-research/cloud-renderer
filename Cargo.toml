[package]
name = "cloud-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
# No clipboard or link-opening: the panel has neither text to copy nor links,
# and the clipboard crate does not build for the web.
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
glam = "0.34"
log = "0.4"
# std::time::Instant panics in a browser; this is the same type everywhere,
# backed by performance.now() on the web.
web-time = "1"
wgpu = "30"
winit = "0.30"

# Native only: blocking on the GPU, the filesystem, and the headless tools.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "9"
pollster = "1"

# Web only: the glue between Rust and the browser. Build with `trunk`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
